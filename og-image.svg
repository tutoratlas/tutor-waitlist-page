<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tutor Atlas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070c"/>
      <stop offset="45%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd38a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e8c07a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c4893a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#c4893a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4893a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="600" cy="220" rx="420" ry="180" fill="url(#glow)"/>
  <g opacity="0.9">
    <rect x="560" y="40" width="6" height="420" fill="url(#beam)"/>
    <rect x="580" y="20" width="8" height="460" fill="url(#beam)"/>
    <rect x="600" y="10" width="10" height="480" fill="url(#beam)"/>
    <rect x="622" y="20" width="8" height="460" fill="url(#beam)"/>
    <rect x="644" y="40" width="6" height="420" fill="url(#beam)"/>
  </g>
  <circle cx="605" cy="250" r="36" fill="none" stroke="#e8c07a" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="605" cy="250" r="10" fill="#ffd38a"/>
  <text x="80" y="480" fill="#e8c07a" font-family="Georgia, serif" font-size="42">Tutor Atlas</text>
  <text x="80" y="545" fill="#f3f1eb" font-family="Georgia, serif" font-size="52">Your AI agent. On standby 24/7.</text>
</svg>
